<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Items - Campus Lost & Found</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <h1 class="page-title">My Items &amp; Claims</h1>
  <p class="page-subtitle">Track the status of everything you've reported or claimed.</p>

  <div id="notifBox"></div>

  <h2 style="color:var(--purple-dark);">Items I Reported</h2>
  <div id="myItems" class="item-list"></div>

  <h2 style="color:var(--purple-dark); margin-top:2rem;">Claims I Raised</h2>
  <div id="myClaims" class="item-list"></div>
</div>

<script src="/js/common.js"></script>
<script>
async function init() {
  await renderNavbar();
  if (!requireLoginOrRedirect()) return;

  const notifs = await api("/notifications");
  const notifBox = document.getElementById("notifBox");
  if (notifs.length) {
    notifBox.innerHTML = `<div class="card"><h3 style="margin-top:0;">Notifications</h3>` +
      notifs.slice(0, 5).map(n => `<div class="meta" style="margin-bottom:0.4rem;">🔔 ${escapeHtml(n.message)}</div>`).join("") +
      `</div>`;
  }

  const items = await api("/items/mine");
  const itemsBox = document.getElementById("myItems");
  itemsBox.innerHTML = items.length ? "" : `<div class="empty-state">You haven't reported any items yet.</div>`;
  items.forEach((item) => {
    itemsBox.appendChild(el(`
      <div class="card item-card">
        <div>
          <h3>${escapeHtml(item.title)} ${badgeForType(item.type)} ${badgeForStatus(item.status)}</h3>
          <div class="meta">${escapeHtml(item.category)} • ${escapeHtml(item.location || "")} • ${escapeHtml(item.date_reported)}</div>
        </div>
        <div class="right">
          <a class="btn small secondary" href="/item.html?id=${item.item_id}">View</a>
          <button class="btn small danger" data-del="${item.item_id}">Delete</button>
        </div>
      </div>
    `));
  });
  itemsBox.querySelectorAll("[data-del]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Withdraw this report?")) return;
      try { await api("/items/" + btn.dataset.del, { method: "DELETE" }); init(); }
      catch (e) { alert(e.message); }
    });
  });

  const claims = await api("/claims/mine");
  const claimsBox = document.getElementById("myClaims");
  claimsBox.innerHTML = claims.length ? "" : `<div class="empty-state">You haven't raised any claims yet.</div>`;
  claims.forEach((c) => {
    const contactLine = c.status === "Approved"
      ? `<div class="meta">✅ Contact <b>${escapeHtml(c.owner_name)}</b> at <b>${escapeHtml(c.owner_contact || c.owner_email)}</b> to arrange the handover.</div>`
      : "";
    claimsBox.appendChild(el(`
      <div class="card item-card">
        <div>
          <h3>${escapeHtml(c.title)} ${badgeForStatus(c.status)}</h3>
          <div class="meta">Requested on ${escapeHtml(c.date_requested)}</div>
          ${contactLine}
        </div>
      </div>
    `));
  });
}
init();
</script>
</body>
</html>
