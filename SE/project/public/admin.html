<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel - Campus Lost & Found</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .tab-btn {
    background: white; border: 1px solid var(--purple); color: var(--purple);
    padding: 0.45rem 1rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-family: inherit;
  }
  .tab-btn.active { background: var(--purple); color: white; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.6rem; }
  @media (max-width: 640px) { .edit-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <h1 class="page-title">Admin Panel</h1>
  <p class="page-subtitle">Verify claims, manage listings, and review activity history.</p>

  <div id="stats" class="stat-grid" style="margin-bottom:1.5rem;"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="claims">Claims</button>
    <button class="tab-btn" data-tab="items">All Listings</button>
    <button class="tab-btn" data-tab="history">Activity History</button>
  </div>

  <div id="tab-claims" class="tab-panel active">
    <div id="claimsBox" class="item-list"></div>
  </div>

  <div id="tab-items" class="tab-panel">
    <div id="itemsBox" class="item-list"></div>
  </div>

  <div id="tab-history" class="tab-panel">
    <div class="card">
      <table id="historyTable">
        <thead><tr><th>When</th><th>Event</th><th>Item</th><th>By</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

async function init() {
  await renderNavbar();
  if (!CURRENT_USER || CURRENT_USER.role !== "admin") {
    window.location.href = "/index.html";
    return;
  }
  const stats = await api("/admin/stats");
  document.getElementById("stats").innerHTML = `
    <div class="stat-card"><div class="num">${stats.totalItems}</div><div class="label">Total Items</div></div>
    <div class="stat-card"><div class="num">${stats.pendingClaims}</div><div class="label">Pending Claims</div></div>
    <div class="stat-card"><div class="num">${stats.claimedItems}</div><div class="label">Items Claimed</div></div>
    <div class="stat-card"><div class="num">${stats.totalUsers}</div><div class="label">Registered Users</div></div>
  `;
  await loadClaims();
  await loadItems();
  await loadHistory();
}

async function loadClaims() {
  const claims = await api("/admin/claims");
  const box = document.getElementById("claimsBox");
  box.innerHTML = claims.length ? "" : `<div class="empty-state">No claims yet.</div>`;
  claims.forEach((c) => {
    const actions = c.status === "Pending" ? `
      <button class="btn small" data-approve="${c.claim_id}">Approve</button>
      <button class="btn small danger" data-reject="${c.claim_id}">Reject</button>
    ` : "";
    box.appendChild(el(`
      <div class="card item-card">
        <div>
          <h3>${escapeHtml(c.title)} ${badgeForType(c.type)} ${badgeForStatus(c.status)}</h3>
          <div class="meta">Claim by ${escapeHtml(c.claimant_name)} (${escapeHtml(c.claimant_email)}) • Listing by ${escapeHtml(c.owner_name)}</div>
          ${c.message ? `<div class="meta">Message: ${escapeHtml(c.message)}</div>` : ""}
        </div>
        <div class="right">${actions}</div>
      </div>
    `));
  });
  box.querySelectorAll("[data-approve]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try { await api(`/admin/claims/${btn.dataset.approve}/approve`, { method: "POST" }); init(); }
      catch (e) { alert(e.message); btn.disabled = false; }
    });
  });
  box.querySelectorAll("[data-reject]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try { await api(`/admin/claims/${btn.dataset.reject}/reject`, { method: "POST" }); init(); }
      catch (e) { alert(e.message); btn.disabled = false; }
    });
  });
}

async function loadItems() {
  const items = await api("/admin/items");
  const box = document.getElementById("itemsBox");
  box.innerHTML = items.length ? "" : `<div class="empty-state">No items yet.</div>`;
  items.forEach((item) => {
    const card = el(`
      <div class="card">
        <div class="item-card">
          <div>
            <h3>${escapeHtml(item.title)} ${badgeForType(item.type)} ${badgeForStatus(item.status)}</h3>
            <div class="meta">${escapeHtml(item.category)} • ${escapeHtml(item.location || "")} • by ${escapeHtml(item.reporter_name)}</div>
          </div>
          <div class="right">
            <button class="btn small secondary" data-edit="${item.item_id}">Edit</button>
            <button class="btn small danger" data-delete="${item.item_id}">Delete</button>
          </div>
        </div>
        <div class="edit-form" id="edit-${item.item_id}" style="display:none;"></div>
      </div>
    `);
    box.appendChild(card);
  });

  box.querySelectorAll("[data-edit]").forEach((btn) => {
    btn.addEventListener("click", () => toggleEdit(btn.dataset.edit, items));
  });
  box.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this listing permanently?")) return;
      await api(`/admin/items/${btn.dataset.delete}`, { method: "DELETE" });
      init();
    });
  });
}

function toggleEdit(id, items) {
  const item = items.find((i) => String(i.item_id) === String(id));
  const box = document.getElementById("edit-" + id);
  if (box.style.display === "block") { box.style.display = "none"; return; }

  box.style.display = "block";
  box.innerHTML = `
    <div class="edit-grid">
      <div><label>Title</label><input id="f-title-${id}" value="${escapeHtml(item.title)}" /></div>
      <div><label>Category</label><input id="f-category-${id}" value="${escapeHtml(item.category)}" /></div>
      <div><label>Location</label><input id="f-location-${id}" value="${escapeHtml(item.location || "")}" /></div>
      <div>
        <label>Status</label>
        <select id="f-status-${id}">
          ${["Pending", "Matched", "Claimed"].map(s => `<option ${s === item.status ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      </div>
      <div style="grid-column: 1 / -1;">
        <label>Description</label>
        <textarea id="f-description-${id}">${escapeHtml(item.description || "")}</textarea>
      </div>
    </div>
    <button class="btn small" id="save-${id}">Save Changes</button>
  `;
  document.getElementById(`save-${id}`).addEventListener("click", async () => {
    await api(`/admin/items/${id}`, {
      method: "PUT",
      body: JSON.stringify({
        title: document.getElementById(`f-title-${id}`).value,
        category: document.getElementById(`f-category-${id}`).value,
        location: document.getElementById(`f-location-${id}`).value,
        status: document.getElementById(`f-status-${id}`).value,
        description: document.getElementById(`f-description-${id}`).value,
      }),
    });
    init();
  });
}

async function loadHistory() {
  const rows = await api("/admin/history");
  const tbody = document.querySelector("#historyTable tbody");
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${escapeHtml(r.at)}</td>
      <td>${escapeHtml(r.event)}</td>
      <td>${escapeHtml(r.detail)}</td>
      <td>${escapeHtml(r.by_user)}</td>
    </tr>
  `).join("") || `<tr><td colspan="4" class="empty-state">No activity yet.</td></tr>`;
}

init();
</script>
</body>
</html>
