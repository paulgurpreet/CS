<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campus Lost & Found</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <h1 class="page-title">Browse Lost &amp; Found Items</h1>
  <p class="page-subtitle">Search and filter items reported by students and staff across campus.</p>

  <div class="card">
    <div class="form-row">
      <div>
        <label for="q">Search</label>
        <input id="q" placeholder="e.g. water bottle, ID card..." />
      </div>
      <div>
        <label for="type">Type</label>
        <select id="type">
          <option value="">All</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category"><option value="">All</option></select>
      </div>
      <div>
        <label for="location">Location</label>
        <input id="location" placeholder="e.g. Library" />
      </div>
      <div>
        <button class="btn" id="searchBtn">Search</button>
      </div>
    </div>
  </div>

  <div id="results" class="item-list"></div>
</div>

<script src="/js/common.js"></script>
<script>
async function loadCategories() {
  const cats = await api("/items/categories");
  const sel = document.getElementById("category");
  cats.forEach((c) => sel.appendChild(el(`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)));
}

async function loadItems() {
  const q = document.getElementById("q").value.trim();
  const type = document.getElementById("type").value;
  const category = document.getElementById("category").value;
  const location = document.getElementById("location").value.trim();

  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (type) params.set("type", type);
  if (category) params.set("category", category);
  if (location) params.set("location", location);

  const items = await api("/items?" + params.toString());
  const box = document.getElementById("results");
  box.innerHTML = "";

  if (items.length === 0) {
    box.appendChild(el(`<div class="empty-state">No items match your search yet.</div>`));
    return;
  }

  items.forEach((item) => {
    box.appendChild(el(`
      <div class="card item-card">
        <div>
          <h3>${escapeHtml(item.title)} ${badgeForType(item.type)} ${badgeForStatus(item.status)}</h3>
          <div class="meta">${escapeHtml(item.category)} • ${escapeHtml(item.location || "Location not specified")} • ${escapeHtml(item.date_reported)}</div>
          <div class="meta">${escapeHtml(item.description || "")}</div>
        </div>
        <div class="right">
          <a class="btn small secondary" href="/item.html?id=${item.item_id}">View details</a>
        </div>
      </div>
    `));
  });
}

document.getElementById("searchBtn").addEventListener("click", loadItems);
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") loadItems(); });

loadCategories();
loadItems();
</script>
</body>
</html>
