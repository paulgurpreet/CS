<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Report Item - Campus Lost & Found</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container" style="max-width:600px;">
  <h1 class="page-title">Report a Lost or Found Item</h1>
  <p class="page-subtitle">Fill in as much detail as you can - it helps others recognise the item faster.</p>

  <div class="card">
    <div id="alertBox"></div>

    <label for="type">This item is</label>
    <select id="type">
      <option value="lost">Lost - I lost this item</option>
      <option value="found">Found - I found this item</option>
    </select>

    <label for="title">Item name</label>
    <input id="title" placeholder="e.g. Black wallet, Blue water bottle" />

    <label for="category">Category</label>
    <select id="category">
      <option>Electronics</option>
      <option>ID Card</option>
      <option>Bag</option>
      <option>Bottle</option>
      <option>Books</option>
      <option>Keys</option>
      <option>Clothing</option>
      <option>Other</option>
    </select>

    <label for="location">Location</label>
    <input id="location" placeholder="e.g. Library, Canteen, Block A" />

    <label for="date_reported">Date</label>
    <input id="date_reported" type="date" />

    <label for="description">Description</label>
    <textarea id="description" placeholder="Colour, brand, any identifying marks..."></textarea>

    <button class="btn" id="submitBtn">Submit Report</button>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
document.getElementById("date_reported").valueAsDate = new Date();

document.getElementById("submitBtn").addEventListener("click", async () => {
  if (!requireLoginOrRedirect()) return;
  const payload = {
    type: document.getElementById("type").value,
    title: document.getElementById("title").value.trim(),
    category: document.getElementById("category").value,
    location: document.getElementById("location").value.trim(),
    date_reported: document.getElementById("date_reported").value,
    description: document.getElementById("description").value.trim(),
  };
  if (!payload.title) {
    document.getElementById("alertBox").innerHTML = `<div class="alert error">Please enter an item name.</div>`;
    return;
  }
  try {
    const item = await api("/items", { method: "POST", body: JSON.stringify(payload) });
    window.location.href = "/item.html?id=" + item.item_id;
  } catch (e) {
    document.getElementById("alertBox").innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
  }
});
</script>
</body>
</html>
